<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Tracker - รัฐภูมิ ทรัพย์มีชัยCE6921</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Sarabun', sans-serif; 
            background-color: #f0f4f8; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
        }
        .container { 
            background: #ffffff; 
            padding: 30px; 
            border-radius: 16px; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 420px; 
            text-align: center; 
        }
        h1 { 
            color: #2c3e50; 
            margin-top: 0;
            margin-bottom: 10px; 
            font-size: 24px;
        }
        .creator-badge { 
            background: #e8f4fd; 
            color: #1976d2; 
            font-size: 0.95em; 
            margin-bottom: 25px; 
            font-weight: 600; 
            padding: 10px 15px; 
            border-radius: 8px;
            border: 1px solid #bbdefb;
            display: inline-block;
        }
        .timer { 
            font-size: 3.5em; 
            font-weight: bold; 
            margin: 20px 0; 
            color: #34495e; 
            font-variant-numeric: tabular-nums;
        }
        input[type="text"] { 
            width: calc(100% - 24px); 
            padding: 12px; 
            margin-bottom: 20px; 
            border: 2px solid #e0e6ed; 
            border-radius: 8px; 
            font-size: 1em; 
            text-align: center; 
            font-family: 'Sarabun', sans-serif;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #3498db;
        }
        .buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
        }
        .buttons button { 
            flex: 1;
            padding: 12px 0; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 1em; 
            font-weight: bold; 
            color: #fff; 
            transition: transform 0.1s, opacity 0.3s; 
            font-family: 'Sarabun', sans-serif;
        }
        .buttons button:active { transform: scale(0.95); }
        .btn-start { background-color: #2ecc71; } .btn-start:hover { opacity: 0.9; }
        .btn-stop { background-color: #e74c3c; } .btn-stop:hover { opacity: 0.9; }
        .btn-reset { background-color: #f1c40f; color: #333 !important; } .btn-reset:hover { opacity: 0.9; }
        .btn-save { 
            background-color: #3498db; 
            width: 100%; 
            padding: 12px;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Sarabun', sans-serif;
            transition: background 0.3s;
        } 
        .btn-save:hover { background-color: #2980b9; }
        
        .history { 
            text-align: left; 
            margin-top: 30px; 
            border-top: 2px solid #f0f4f8; 
            padding-top: 15px; 
        }
        .history h3 { 
            margin-bottom: 15px; 
            color: #7f8c8d; 
            font-size: 1.1em;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .clear-btn {
            background: none;
            border: none;
            color: #e74c3c;
            cursor: pointer;
            font-size: 0.8em;
            text-decoration: underline;
            font-family: 'Sarabun', sans-serif;
        }
        .task-list { 
            list-style: none; 
            padding: 0; 
            margin: 0; 
            max-height: 180px; 
            overflow-y: auto; 
        }
        .task-list li { 
            background: #f8f9fa; 
            margin-bottom: 8px; 
            padding: 12px; 
            border-radius: 8px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            font-size: 0.95em; 
            border-left: 4px solid #3498db;
        }
        .task-info { display: flex; flex-direction: column; }
        .task-name { font-weight: 600; color: #2c3e50; }
        .task-date { font-size: 0.8em; color: #95a5a6; }
        .task-time { font-weight: bold; color: #27ae60; background: #e8f8f5; padding: 4px 8px; border-radius: 4px;}
        
        /* Custom Scrollbar */
        .task-list::-webkit-scrollbar { width: 6px; }
        .task-list::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px;}
        .task-list::-webkit-scrollbar-thumb { background: #cbd5e0; border-radius: 4px;}
    </style>
</head>
<body>

<div class="container">
    <h1>Time Tracker</h1>
    <!-- แสดงชื่อผู้จัดทำชัดเจน -->
    <div class="creator-badge">👨‍💻 ผู้จัดทำ: รัฐภูมิ ทรัพย์มีชัยCE6921</div>

    <input type="text" id="taskName" placeholder="ระบุชื่องานที่คุณกำลังทำ...">
    <div class="timer" id="display">00:00:00</div>

    <div class="buttons">
        <button class="btn-start" onclick="startTimer()">เริ่ม (Start)</button>
        <button class="btn-stop" onclick="stopTimer()">หยุด (Stop)</button>
        <button class="btn-reset" onclick="resetTimer()">รีเซ็ต (Reset)</button>
    </div>
    <button class="btn-save" onclick="saveTask()">💾 บันทึกเวลาลงประวัติ</button>

    <div class="history">
        <h3>ประวัติการทำงาน <button class="clear-btn" onclick="clearHistory()">ล้างประวัติ</button></h3>
        <ul class="task-list" id="taskList">
            <!-- ประวัติจะแสดงที่นี่ -->
        </ul>
    </div>
</div>

<script>
    let startTime, updatedTime, difference, tInterval, savedTime = 0;
    let running = false;
    const display = document.getElementById('display');
    const taskNameInput = document.getElementById('taskName');
    const taskList = document.getElementById('taskList');

    function startTimer() {
        if (!running) {
            startTime = new Date().getTime() - savedTime;
            tInterval = setInterval(getShowTime, 10);
            running = true;
        }
    }

    function stopTimer() {
        if (running) {
            clearInterval(tInterval);
            savedTime = difference;
            running = false;
        }
    }

    function resetTimer() {
        clearInterval(tInterval);
        savedTime = 0;
        running = false;
        display.innerHTML = "00:00:00";
    }

    function getShowTime() {
        updatedTime = new Date().getTime();
        difference = updatedTime - startTime;

        let hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        let minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
        let seconds = Math.floor((difference % (1000 * 60)) / 1000);

        hours = (hours < 10) ? "0" + hours : hours;
        minutes = (minutes < 10) ? "0" + minutes : minutes;
        seconds = (seconds < 10) ? "0" + seconds : seconds;

        display.innerHTML = hours + ":" + minutes + ":" + seconds;
    }

    function saveTask() {
        if (savedTime === 0 && !running && display.innerHTML === "00:00:00") {
            alert("กรุณาจับเวลาก่อนบันทึกประวัติครับ");
            return;
        }
        
        stopTimer(); 
        
        let taskName = taskNameInput.value.trim() || "ไม่ได้ระบุชื่องาน";
        let timeSpent = display.innerHTML;
        let dateNow = new Date().toLocaleString('th-TH');
        
        // บันทึกลง LocalStorage
        saveToLocalStorage(taskName, timeSpent, dateNow);
        
        // อัปเดตหน้าจอทันที
        renderTask(taskName, timeSpent, dateNow);
        
        // รีเซ็ตเพื่อเตรียมจับเวลางานต่อไป
        resetTimer();
        taskNameInput.value = '';
    }

    function renderTask(task, time, date) {
        const li = document.createElement('li');
        li.innerHTML = `
            <div class="task-info">
                <span class="task-name">${task}</span>
                <span class="task-date">${date}</span>
            </div>
            <span class="task-time">${time}</span>
        `;
        taskList.prepend(li); // เพิ่มไว้บนสุด
    }

    function saveToLocalStorage(task, time, date) {
        let tasks = JSON.parse(localStorage.getItem('myTimeTrackerTasks')) || [];
        tasks.push({ task, time, date });
        localStorage.setItem('myTimeTrackerTasks', JSON.stringify(tasks));
    }

    function loadTasks() {
        let tasks = JSON.parse(localStorage.getItem('myTimeTrackerTasks')) || [];
        tasks.forEach(item => {
            renderTask(item.task, item.time, item.date);
        });
    }

    function clearHistory() {
        if(confirm("คุณต้องการล้างประวัติการทำงานทั้งหมดใช่หรือไม่?")) {
            localStorage.removeItem('myTimeTrackerTasks');
            taskList.innerHTML = '';
        }
    }

    // โหลดประวัติเมื่อเปิดหน้าเว็บ
    window.onload = loadTasks;
</script>
</body>
</html>
